train_dataloader: 
  dataset: 
    transforms:
      ops:
        - {type: Mosaic, output_size: 320, rotation_range: 10, translation_range: [0.1, 0.1], scaling_range: [0.5, 1.5],
           probability: 1.0, fill_value: 0, use_cache: False, max_cached_images: 50, random_pop: True}
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640], }
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        epoch: [4, 29, 50]   # list 
        ops: ['Mosaic', 'RandomPhotometricDistort', 'RandomZoomOut', 'RandomIoUCrop']
      mosaic_prob: 0.5
    
  total_batch_size: 24 # total batch size equals to {} (number of gpu * batch_size)
  num_workers: 24

  collate_fn:
    mixup_prob: 0.5
    mixup_epochs: [4, 29]
    stop_epoch: 50    # epoch in [72, ~) stop `multiscales`

# Unfreezing BN
PResNet:
  freeze_at: -1     # default 0
  freeze_norm: False   # default True

# Activation
RTDETRTransformerv2:
  query_pos_method: as_reg
  activation: silu
  mlp_act: silu

# LR-Scheduler
lrsheduler: flatcosine
lr_gamma: 0.5
warmup_iter: 2000
flat_epoch: 29    # 4 + epoch // 2, e.g., 40 = 4 + 72 / 2
no_aug_epoch: 8


# Our Loss
HACriterion:
  weight_dict: {loss_dgl: 1, loss_bbox: 5, loss_giou: 2}
  losses: ['dgl', 'boxes', ]
  gamma_neg: 1.8
  gamma_pos: 1.5
  alpha: 0.75